name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-latest }
          - { os: darwin, arch: amd64, runner: macos-13 }
          - { os: darwin, arch: arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/orbit-sh/orbit-cli/internal/cmd.version=${{ github.ref_name }}" \
            -o orbit ./cmd/orbit

      - name: Package
        run: |
          dir="orbit_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir "$dir"
          cp orbit "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: orbit_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}
          path: orbit_${{ github.ref_name }}_*_*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Aggregate checksums
        run: cat *.sha256 | tee checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            orbit_*_*.tar.gz
            checksums.txt
